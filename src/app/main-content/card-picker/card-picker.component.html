<mat-form-field appearance="outline" class="w-full">
  <input
    type="text"
    placeholder="Karte..."
    matInput
    [matAutocomplete]="auto"
    [(ngModel)]="query"
    (input)="filterCards()"
  />

  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectCard($event)">
    <mat-option *ngFor="let card of filteredCards" [value]="card">
      {{ card.id }} – {{ card.name }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
